name: Deploy PRISM to GitHub Pages

on:
  # 推送到以下分支时自动部署到 GitHub Pages（项目站点）。
  push:
    branches:
      - main
  # 也可在 Actions 页面手动触发。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build site
        env:
          # 项目站点位于 https://<user>.github.io/<repo>/，用仓库名作为 basePath 前缀。
          # 若你的仓库名为 <user>.github.io（用户站点），请把下行改为空字符串 ""。
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4