[[items]]
eyebrow = "Haptic framework · Modular proxies"
title = "PhysicsHap: A Modular Haptic Interaction Framework for Enhancing Student Learning in Immersive Virtual Physics Experiments"
title_link = "https://doi.org/10.1109/TVCG.2026.3679917"
affiliation = "School of Artificial Intelligence, Beijing Normal University"
role = "Second Author"
advisor = "Advisors: Prof. Yanlin Luo / Assoc. Prof. Hongwen Zhang"
date = "2024.03 – 2026.09"
status = "IEEE TVCG 2026"
content = "PhysicsHap is a modular framework for rapidly building reconfigurable haptic proxies for virtual physics experiments: from a systematic analysis of 45 secondary-school physics experiments it decouples haptics into cutaneous (shape/texture) and kinesthetic (force/damping) channels, combining passive Tangible Bodies with active Force Engines (a brushless motor and magnetic encoder for linear, rotational and vibrotactile feedback), and uses Quest 3 hand tracking for tracker-free physical–virtual synchronization. A 64-participant randomized controlled experiment shows that, versus gesture interaction, it significantly improves experimental knowledge and comprehensive ability, optimizes cognitive load (ECL↓, GCL↑) and increases learning motivation."
metrics = [
    "Analysis of 45 secondary-school physics experiments",
    "N=64 randomized controlled experiment",
    "Comprehensive ability & motivation analysis",
    "NSFC Grant No. 62377004",
]
tags = ["Modular Haptic Proxy", "Immersive Virtual Physics", "Force Feedback"]
methods = [
    "Unity",
    "Meta Quest 3 Hand Tracking",
    "BLDC Motor + SimpleFOC",
    "AS5600 Encoder",
    "3D Printing",
    "Arduino",
]
actions = [
    { label = "Paper", href = "https://doi.org/10.1109/TVCG.2026.3679917", type = "paper" },
    { label = "Code", href = "https://github.com/lyh-12/PhysicsHap", type = "code" },
]
teaser = "PHY-03"
teaser_label = "A modular haptic framework for virtual physics experiments"
