[[items]]
eyebrow = "Current research · Passthrough MR"
title = "EgoAnchor: Zero-Shot Dynamic Anchoring of Everyday Objects in Passthrough Mixed Reality"
affiliation = "School of Artificial Intelligence, Beijing Normal University"
role = "First Author"
advisor = "Advisors: Prof. Yanlin Luo, Assoc. Prof. Hongwen Zhang"
date = "2025.09 – 2026.08"
status = "In submission to IEEE VR 2027"
content = "EgoAnchor turns the asynchronous, low-rate observations of zero-shot 6-DoF pose estimation into continuous, stable, and recoverable object anchors in passthrough MR. The perception backend chains open-vocabulary detection, temporal segmentation, stereo depth, and pose estimation, scored by a VCD measure; at runtime, a Kalman filter with interpolation synthesizes render-synchronous anchors, while StaticLock suppresses jitter and reacquires after occlusion. Benchmarks, ablations, and a 24-participant study on Quest 3 and Unity show better registration, occlusion recovery, and trajectory residuals than the baselines."
metrics = [
    "Head-motion coupling error ↓",
    "Occlusion-recovery error ↓",
    "N=24 within-subject study",
    "NSFC Grant No. 62377004",
]
tags = [
    "Passthrough Mixed Reality",
    "Zero-Shot 6-DoF Pose",
    "Dynamic Object Anchoring",
]
methods = [
    "Meta Quest 3",
    "Unity",
    "C#",
    "FoundationPose",
    "YOLOE",
    "Cutie",
    "Fast-FoundationStereo",
    "Kalman Filter",
    "ZeroMQ / NATS",
]
teaser = "EGO-01"
teaser_label = "Zero-shot dynamic anchoring of everyday objects in passthrough MR"
