[[items]]
eyebrow = "Embodied learning · Consistent haptics"
title = "MomentumTouch: How Consistent Haptic Feedback Empowers VR Embodied Learning through Cognitive Resource Reconstruction"
title_link = "https://doi.org/10.1145/3772318.3791751"
affiliation = "School of Artificial Intelligence, Beijing Normal University"
role = "First Author"
advisor = "Advisors: Prof. Yanlin Luo, Assoc. Prof. Hongwen Zhang"
date = "2024.03 – 2025.09"
status = "ACM CHI 2026"
content = "MomentumTouch targets the high-school physics unit on the conservation of momentum: a low-cost 3D-printed apparatus (spring slider, knob, button) paired with Quest 3 delivers consistent haptic feedback satisfying both physical similarity and dynamic colocation. A mixed-methods study with 64 students in a real classroom reveals a Cognitive Resource Reconstruction effect: consistent haptics significantly reduced extraneous load while increasing germane load, and enhanced motivation and immersion—pointing to stronger conceptual grounding and readiness for transfer."
metrics = [
    "N=64 real-classroom field study",
    "64-channel EEG triangulation",
    "ECL ↓ · GCL ↑",
    "NSFC Grant No. 62377004",
]
tags = ["Embodied Learning", "Consistent Haptic Feedback", "VR STEM Education"]
