[[items]]
eyebrow = "Current research · Passthrough MR"
title = "EgoAnchor: Zero-Shot Dynamic Anchoring of Everyday Objects in Passthrough Mixed Reality"
affiliation = "School of Artificial Intelligence, Beijing Normal University"
role = "First Author"
advisor = "Advisors: Prof. Yanlin Luo / Assoc. Prof. Hongwen Zhang"
date = "2025.09 – 2026.08"
status = "In submission to IEEE VR 2027"
content = "EgoAnchor turns the asynchronous, low-rate and unstable observations of zero-shot 6-DoF pose estimation into continuous, stable and recoverable object anchors in passthrough MR: its perception backend chains open-vocabulary detection, temporal segmentation, stereo depth and pose estimation scored by a visibility–color–depth (VCD) measure, while the runtime aligns by capture time and uses a Kalman filter and interpolation to synthesize render-synchronous anchors, with StaticLock suppressing idle jitter and reacquiring after occlusion. Built on Meta Quest 3 and Unity, controlled benchmarks, ablations and a 24-participant study show better static registration, occlusion recovery and trajectory residuals than the baselines."
metrics = [
    "Head-motion coupling error",
    "Occlusion-recovery error",
    "N=24 within-subject study",
    "NSFC Grant No. 62377004",
]
tags = [
    "Passthrough Mixed Reality",
    "Zero-Shot 6-DoF Pose",
    "Dynamic Object Anchoring",
]
methods = [
    "Meta Quest 3",
    "Unity",
    "C#",
    "FoundationPose",
    "YOLOE",
    "Cutie",
    "Fast-FoundationStereo",
    "Kalman Filter",
    "ZeroMQ / NATS",
]
teaser = "EGO-01"
teaser_label = "Zero-shot dynamic anchoring of everyday objects in passthrough MR"
