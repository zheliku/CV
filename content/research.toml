[[items]]
eyebrow = "Embodied learning · Consistent haptics"
title = "MomentumTouch: How Consistent Haptic Feedback Empowers VR Embodied Learning through Cognitive Resource Reconstruction"
title_link = "https://doi.org/10.1145/3772318.3791751"
affiliation = "School of Artificial Intelligence, Beijing Normal University"
role = "First Author"
advisor = "Advisors: Prof. Yanlin Luo / Assoc. Prof. Hongwen Zhang"
date = "2024.03 – 2025.09"
status = "ACM CHI 2026"
content = "MomentumTouch targets the high-school physics unit on conservation of momentum, using a low-cost 3D-printed apparatus (a spring-loaded slider, a knob and a button) with the Meta Quest 3 to deliver consistent haptic feedback that satisfies both physical similarity and dynamic colocation. In a real classroom we ran a between-subjects mixed-methods study with 64 senior-year students (pre/post knowledge tests, cognitive load, ARCS motivation, immersion, 64-channel EEG and interviews). The results reveal a Cognitive Resource Reconstruction effect: consistent haptics significantly lowered extraneous load and raised germane load, and improved motivation and immersion, while short-term knowledge gain stayed non-significant—together indicating stronger conceptual grounding and readiness for transfer."
metrics = [
    "N=64 field study in a real classroom",
    "64-channel EEG triangulation",
    "ECL ↓ · GCL ↑",
    "NSFC Grant No. 62377004",
]
tags = ["Embodied Learning", "Consistent Haptic Feedback", "VR STEM Education"]
methods = [
    "Unity",
    "Meta Quest 3",
    "3D-Printed Haptic Apparatus",
    "Arduino",
    "EEG",
    "Mixed-Methods Study",
]
actions = [
