[[items]]
eyebrow = "触觉框架 · 模块化代理"
title = "PhysicsHap: A Modular Haptic Interaction Framework for Enhancing Student Learning in Immersive Virtual Physics Experiments"
title_link = "https://doi.org/10.1109/TVCG.2026.3679917"
affiliation = "北京师范大学 · 人工智能学院"
role = "第二作者"
advisor = "导师：骆岩林教授/张鸿文副教授"
date = "2024.03 – 2026.09"
status = "IEEE TVCG 2026"
content = "PhysicsHap 是面向虚拟物理实验、快速搭建可重构触觉代理的模块化框架：对 45 个中学物理实验做系统分析，把触觉解耦为皮肤觉（形状/纹理）与动觉（力/阻尼），组合被动 Tangible Body 与主动 Force Engine（无刷电机+磁编码器，平动/转动/振动），并以 Quest 3 手部跟踪实现免外部追踪器的物理-虚拟同步。64 人随机对照实验显示，相较手势交互它显著提升实验知识与综合能力、优化认知负荷（ECL↓、GCL↑）并提升学习动机。"
metrics = [
    "45 个中学物理实验交互分析",
    "N=64 随机对照实验",
    "综合能力 · 动机分析",
    "国家自然科学基金（No. 62377004）",
]
tags = ["模块化触觉代理", "沉浸式虚拟物理实验", "力反馈"]
methods = [
    "Unity",
    "Meta Quest 3 手部跟踪",
    "BLDC 电机 + SimpleFOC",
    "AS5600 编码器",
    "3D 打印",
    "Arduino",
]
actions = [
    { label = "论文", href = "https://doi.org/10.1109/TVCG.2026.3679917", type = "paper" },
    { label = "代码", href = "https://github.com/lyh-12/PhysicsHap", type = "code" },
]
