[[items]]
eyebrow = "当前研究 · Passthrough MR"
title = "EgoAnchor: Zero-Shot Dynamic Anchoring of Everyday Objects in Passthrough Mixed Reality"
affiliation = "北京师范大学 · 人工智能学院"
role = "第一作者"
advisor = "导师：骆岩林教授、张鸿文副教授"
date = "2025.09 – 2026.08"
status = "在投 IEEE VR 2027"
content = "EgoAnchor 将零样本 6-DoF 位姿估计的异步低频观测，转化为透视 MR 中连续、稳定、可恢复的物体锚定：感知后端串联开放词汇检测、时序分割、立体深度与位姿估计并以 VCD 度量打分；运行时以卡尔曼滤波与插值合成渲染同步锚定，StaticLock 抑制抖动并支持遮挡后重捕获。基于 Quest 3 与 Unity 的基准、消融与 24 人用户研究显示，其配准精度、遮挡恢复与轨迹残差均优于基线。"
metrics = ["头动耦合误差 ↓", "遮挡恢复误差 ↓", "N=24 被试内实验", "国家自然科学基金（No. 62377004）"]
tags = ["透视混合现实", "零样本 6-DoF 位姿估计", "动态物体锚定"]
methods = [
    "Meta Quest 3",
    "Unity",
    "C#",
    "FoundationPose",
    "YOLOE",
    "Cutie",
    "Fast-FoundationStereo",
    "Kalman 滤波",
    "ZeroMQ / NATS",
]
teaser = "EGO-01"
teaser_label = "透视 MR 中日常物体的零样本动态锚定"
images = ["/research/26egoanchor-01.png", "/research/26egoanchor-02.webp"]

[[items]]
eyebrow = "具身学习 · 一致性触觉"
title = "MomentumTouch: How Consistent Haptic Feedback Empowers VR Embodied Learning through Cognitive Resource Reconstruction"
title_link = "https://doi.org/10.1145/3772318.3791751"
affiliation = "北京师范大学 · 人工智能学院"
role = "第一作者"
advisor = "导师：骆岩林教授、张鸿文副教授"
date = "2024.03 – 2025.09"
status = "ACM CHI 2026"
content = "MomentumTouch 面向高中物理“动量守恒”单元，以低成本 3D 打印装置（弹簧滑块、旋钮、按钮）配合 Quest 3，提供满足物理相似性与动态同位的一致性触觉反馈。64 名高二学生的真实课堂混合方法研究表明，一致性触觉可重构认知资源：显著降低外在负荷、提升相关负荷并增强动机与沉浸感，指向更扎实的概念建构与迁移准备。"
metrics = [
    "N=64 真实课堂现场实验",
    "64 通道 EEG 三角验证",
    "ECL ↓ · GCL ↑",
    "国家自然科学基金（No. 62377004）",
]
tags = ["具身学习", "一致性触觉反馈", "VR STEM 教育"]
methods = ["Unity", "Meta Quest 3", "3D 打印触觉装置", "Arduino", "EEG", "混合方法研究"]
actions = [
    { label = "论文", href = "https://doi.org/10.1145/3772318.3791751", type = "paper" },
    { label = "代码", href = "https://github.com/zheliku/MomentumTouch", type = "code" },
]
teaser = "MOM-02"
teaser_label = "一致性触觉与认知资源重构"
